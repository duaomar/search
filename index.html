
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="image.html">Images</a>
        <a href="advanced.html">Advanced Search</a>
    </nav>

    <main class="home">
        <div class="google-logo" aria-label="Google">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <form action="https://www.google.com/search" method="get">
            <div class="search-box">
                <span class="search-icon">⌕</span>
                <input type="text" name="q" aria-label="Search Google" required>
            </div>

            <div class="buttons">
                <button type="submit">Google Search</button>
                <button type="submit" name="btnI" value="1">
                    I'm Feeling Lucky
                </button>
            </div>
        </form>
    </main>
</body>
</html>
