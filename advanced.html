
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a href="index.html">Google Search</a>
        <a href="image.html">Images</a>
    </nav>

    <header class="advanced-header">
        <div class="small-logo">
            <a href="index.html">
                <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
            </a>
        </div>
        <h1>Advanced Search</h1>
    </header>

    <main class="advanced-container">
        <h2>Find pages with...</h2>

        <form action="https://www.google.com/search" method="get">
            <div class="advanced-row">
                <label for="all">all these words:</label>
                <input id="all" type="text" name="as_q">
            </div>

            <div class="advanced-row">
                <label for="exact">this exact word or phrase:</label>
                <input id="exact" type="text" name="as_epq">
            </div>

            <div class="advanced-row">
                <label for="any">any of these words:</label>
                <input id="any" type="text" name="as_oq">
            </div>

            <div class="advanced-row">
                <label for="none">none of these words:</label>
                <input id="none" type="text" name="as_eq">
            </div>

            <div class="advanced-button-row">
                <button class="advanced-button" type="submit">
                    Advanced Search
                </button>
            </div>
        </form>
    </main>
</body>
</html>
